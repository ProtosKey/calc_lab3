plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.0'
    id 'org.jetbrains.compose' version '1.5.0'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.scilab.forge:jlatexmath:1.0.7")
    implementation(compose.desktop.currentOs)
    implementation(compose.material3)
}

kotlin {
    jvmToolchain(17)
}